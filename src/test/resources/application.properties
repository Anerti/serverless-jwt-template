spring.application.name=jwt-serverless-template-test

app.base-url=http://localhost:8080
app.jwt.expiration-ms=3600000

app.rate-limit.critical-per-minute=10000
app.rate-limit.sensitive-per-minute=10000
app.rate-limit.standard-per-minute=10000

server.forward-headers-strategy=native

app.pagination.default-page=1
app.pagination.default-size=20

spring.datasource.driver-class-name=org.postgresql.Driver

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@example.com
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
